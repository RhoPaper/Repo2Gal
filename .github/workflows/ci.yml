name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install --yes libmagic1

      - name: Install Repo2Gal
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -e ".[dev]"

      - name: Run offline tests
        run: .venv/bin/python -m pytest tests/ -q

      - name: Validate built-in public Asset Pack
        run: .venv/bin/repo2gal assets validate builtin:cc0-chronicle --public

      - name: Build release wheel
        run: .venv/bin/pip wheel . --no-deps --wheel-dir dist
