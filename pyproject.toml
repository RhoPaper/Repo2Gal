[project]
name = "repo2gal"
version = "0.5.0"
description = "把 GitHub 仓库变成可游玩的 WebGAL 视觉小说"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28",
    "click>=8.0",
    "github-backup>=0.65,<0.66",
    "jsonschema[format-nongpl]>=4.26,<5",
    "semver>=3.0.4,<4",
    "packaging>=26.3,<27",
    "langcodes>=3.5.1,<4",
    "python-magic>=0.4.27,<0.5",
    "coloraide>=8.11.1,<9",
    "Pillow>=12.3,<13",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
repo2gal = "repo2gal.cli:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["repo2gal*"]

[tool.setuptools.package-data]
repo2gal = [
    "prompts/*.md",
    "schemas/*.json",
    "legal/*.txt",
    "examples/cc0-chronicle-pack/*",
    "examples/cc0-chronicle-pack/audio/*",
    "examples/cc0-chronicle-pack/backgrounds/*",
    "examples/cc0-chronicle-pack/characters/guide/*",
]
